<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Excluir Cliente</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    background:#f4f6fb;
    font-family:'Segoe UI', sans-serif;
}

.sidebar{
    width:260px;
    height:100vh;
    position:fixed;
    top:0;
    left:0;
    background:linear-gradient(180deg,#071739,#0b2b63);
    padding:25px 15px;
    overflow-y:auto;
}

.logo{
    color:white;
    font-size:24px;
    font-weight:bold;
    margin-bottom:40px;
}

.menu-link{
    display:flex;
    align-items:center;
    gap:12px;
    color:white;
    text-decoration:none;
    padding:14px;
    border-radius:12px;
    margin-bottom:10px;
    transition:.3s;
}

.menu-link:hover{
    background:#2563eb;
}

.menu-link.active{
    background:#2563eb;
}

.main-content{
    margin-left:260px;
    padding:35px;
}

.btn-voltar{
    border:none;
    background:white;
    padding:10px 18px;
    border-radius:10px;
    font-weight:600;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.subtitulo{
    color:#777;
}

.card-form{
    border:none;
    border-radius:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.form-control{
    border-radius:12px;
    padding:12px;
    background-color: #f8fafc; 
}

.form-control:disabled {
    background-color: #e2e8f0;
    opacity: 1;
}

.btn-excluir{
    background:#dc2626;
    color: white;
    border:none;
    padding:12px 22px;
    border-radius:12px;
    font-weight:600;
}

.btn-excluir:hover{
    background:#b91c1c;
    color: white;
}

.btn-cancelar{
    padding:12px 22px;
    border-radius:12px;
    font-weight:600;
}

.alert-danger {
    border-radius: 12px;
    border-left: 5px solid #dc2626;
}

@media(max-width:768px){
    .sidebar{
        width:100%;
        height:auto;
        position:relative;
    }
    .main-content{
        margin-left:0;
    }
}

</style>
</head>
<body>

<div class="sidebar">

    <div class="logo">
        <i class="fa-solid fa-book"></i>
        Biblioteca
    </div>

    <a href="#" class="menu-link">
        <i class="fa-solid fa-house"></i>
        Dashboard
    </a>

    <a href="#" class="menu-link">
        <i class="fa-solid fa-book-open"></i>
        Livros
    </a>

    <a href="#" class="menu-link active">
        <i class="fa-solid fa-users"></i>
        Clientes
    </a>

    <a href="#" class="menu-link">
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
        Empréstimos
    </a>

    <a href="#" class="menu-link">
        <i class="fa-solid fa-bookmark"></i>
        Reservas
    </a>

    <a href="#" class="menu-link">
        <i class="fa-solid fa-rotate-left"></i>
        Devoluções
    </a>

    <a href="#" class="menu-link">
        <i class="fa-solid fa-chart-column"></i>
        Relatórios
    </a>

    <a href="#" class="menu-link">
        <i class="fa-solid fa-gear"></i>
        Configurações
    </a>

</div>

<div class="main-content">
    <div class="d-flex align-items-center gap-3 mb-4">

        <button
             class="btn-voltar"
                onclick="window.location.href='cliente.html'">
                <i class="fa-solid fa-arrow-left"></i>
                            Voltar
        </button>

        <div>
            <h2 class="fw-bold mb-1 text-danger">Excluir Cliente</h2>
            <p class="subtitulo mb-0">
                Confirme a exclusão dos dados deste cliente
            </p>
        </div>
    </div>

    <div class="card card-form p-4">

        <div class="alert alert-danger d-flex align-items-center gap-3 mb-4" role="alert">
            <i class="fa-solid fa-triangle-exclamation fs-3"></i>
            <div>
                <strong>Atenção!</strong> Esta ação é permanente e não poderá ser desfeita. 
                Tem certeza que deseja excluir o cliente abaixo do sistema?
            </div>
        </div>

        <form>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        Nome Completo
                    </label>
                    <input
                    type="text"
                    class="form-control"
                    value="João da Silva" disabled>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        Email
                    </label>
                    <input
                    type="email"
                    class="form-control"
                    value="joao@gmail.com" disabled>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        CPF
                    </label>
                    <input
                    type="text"
                    class="form-control"
                    value="123.456.789-00" disabled>
                </div>

                <div class="col-md-6">
                    <label class="form-label fw-semibold">
                        Telefone
                    </label>
                    <input
                    type="text"
                    class="form-control"
                    value="(47) 99999-9999" disabled>
                </div>

            </div>

            <div class="d-flex justify-content-end gap-3 mt-5">

                <button
                type="button"
                class="btn btn-light btn-cancelar"
                onclick="window.location.href='cliente.html'">
                    Cancelar
                </button>

                <button
                type="submit"
                class="btn btn-excluir">
                    <i class="fa-solid fa-trash"></i>
                    Confirmar Exclusão
                </button>

            </div>
        </form>
    </div>
</div>

</body>
</html>
