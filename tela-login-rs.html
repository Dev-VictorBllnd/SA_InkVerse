<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci Minha Senha</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            height: 100vh;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }

        .container-recuperar{
            width: 1000px;
            height: 600px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .left-side{
            width: 40%;
            background: #0b31ad;
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .logo{
            font-size: 35px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        .left-side h2{
            font-size: 35px;
            margin-bottom: 20px;
        }

        .left-side p{
            font-size: 17px;
            line-height: 1.7;
            color: #dfe6ff;
        }

        .right-side{
            width: 60%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }

        .form-box{
            width: 100%;
            max-width: 450px;
        }

        .form-box h1{
            font-size: 40px;
            margin-bottom: 10px;
            color: #111827;
        }

        .form-box p{
            color: #777;
            margin-bottom: 30px;
        }

        .form-label{
            font-weight: 600;
            margin-bottom: 8px;
        }

        .form-control{
            height: 52px;
            border-radius: 10px;
        }

        .input-group-text{
            background: white;
            border-radius: 10px 0 0 10px;
        }

        .btn-enviar{
            height: 52px;
            border-radius: 10px;
            background: #2456ff;
            border: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-enviar:hover{
            background: #153ec9;
            transform: scale(1.02);
        }

        .voltar{
            margin-top: 25px;
            text-align: center;
        }

        .voltar a{
            text-decoration: none;
            color: #2456ff;
            font-weight: bold;
        }

        .voltar a:hover{
            text-decoration: underline;
        }

        @media(max-width: 900px){

            body{
                padding: 20px;
            }

            .container-recuperar{
                flex-direction: column;
                width: 100%;
                height: auto;
            }

            .left-side,
            .right-side{
                width: 100%;
            }

            .left-side{
                text-align: center;
                padding: 40px 25px;
            }

            .right-side{
                padding: 40px 25px;
            }
        }

    </style>
</head>

<body>

    <div class="container-recuperar">

        <div class="left-side">

            <div class="logo">
                Biblioteca
            </div>

            <h2>Recuperar Senha</h2>

            <p>
                Informe seu e-mail para receber as instruções de recuperação de senha.
            </p>

        </div>

        <div class="right-side">

            <div class="form-box">

                <h1>Esqueci Minha Senha</h1>

                <p>
                    Digite seu e-mail cadastrado abaixo.
                </p>

                <form action="recuperar-senha.php" method="POST">

                    <div class="mb-4">

                        <label class="form-label">
                            E-mail
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-envelope-fill"></i>
                            </span>

                            <input type="email"
                                   name="email"
                                   class="form-control"
                                   placeholder="Digite seu e-mail"
                                   required>

                        </div>

                    </div>

                    <button type="submit"
                            class="btn btn-primary w-100 btn-enviar">

                        Gerar código

                    </button>

                </form>

                <div class="voltar">
                    <a href="login.php">
                        Voltar para login
                    </a>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
