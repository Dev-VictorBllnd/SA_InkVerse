<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Biblioteca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            background: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container-login{
            width: 1100px;
            height: 650px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .left-side{
            width: 40%;
            background: linear-gradient( #0b31ad);
            color: white;
            padding: 50px;
            display: flex;
            flex-direction: column;
        }
        .logo{
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 32px;
            font-weight: bold;
            color: white;
        }
        .logo i{
            font-size: 35px;
            color: white;
        }
        .welcome{
            margin-top: 50px;
        }
        .welcome h2{
            font-size: 35px;
            margin-bottom: 15px;
        }
        .welcome p{
            font-size: 17px;
            line-height: 1.7;
            color: #dfe6ff;
        }
        .books{
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .books img{
            width: 380px;
            background: #153ec9;
           

        }
        .right-side{
            width: 60%;
            padding: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box{
            width: 100%;
            max-width: 500px;
        }
        .login-box h1{
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #111827;
        }
        .login-box p{
            color: #777;
            margin-bottom: 30px;
        }
        .form-label{
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-control{
            height: 52px;
            border-radius: 10px;
        }
        .input-group-text{
            background: white;
            border-radius: 10px 0 0 10px;
        }
        .input-group i{
            font-size: 18px;
        }
        .options{
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .options a{
            text-decoration: none;
            color: #2456ff;
            font-weight: 500;
        }
        .options a:hover{
            text-decoration: underline;
        }
        .btn-login{
            height: 52px;
            border-radius: 10px;
            background: #2456ff;
            border: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-login:hover{
            background: #153ec9;
            transform: scale(1.02);
        }
        .footer-text{
            text-align: center;
            margin-top: 30px;
            color: #777;
        }
        .footer-text a{
            text-decoration: none;
            color: #2456ff;
            font-weight: bold;
        }
        @media(max-width: 900px){
            body{
                padding: 20px;
            }
            .container-login{
                flex-direction: column;
                width: 100%;
                height: auto;
            }
            .left-side,
            .right-side{
                width: 100%;
            }
            .left-side{
                text-align: center;
                padding: 40px 25px;
            }
            .welcome{
                margin-top: 30px;
            }
            .books img{
                width: 180px;
                margin-top: 20px;
            }
            .right-side{
                padding: 40px 25px;
            }
            .options{
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container-login">
        <div class="left-side">
            <div>
                <div class="logo">
                    
                    <span>Biblioteca</span>
                </div>
                <div class="welcome">
                    <h2>Seja Bem-vindo!</h2>
                    <p>
                        Faça login para acessar a biblioteca.
                    </p>
                </div>
            </div>
            <div class="books">
                <img src="img/1.2.png" alt="Livros">
            </div>
        </div>
        <div class="right-side">
            <div class="login-box">
                <h1>Login</h1>
                <p>
                    Entre com seu usuário e senha para acessar o sistema.
                </p>
                <form>
                    <div class="mb-4">
                        <label class="form-label">
                            Usuário
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-person-fill"></i>
                            </span>
                            <input type="text"
                                   class="form-control"
                                   placeholder="Digite seu usuário">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">
                            Senha
                        </label>
                        <div class="input-group">
                            <span class="input-group-text">
                                <i class="bi bi-lock-fill"></i>
                            </span>
                            <input type="password"
                                   class="form-control"
                                   placeholder="Digite sua senha">
                            <span class="input-group-text">
                                <i class="bi bi-eye-fill"></i>
                            </span>
                        </div>
                    </div>
                    <div class="options">
                        <div class="form-check">
                            <input class="form-check-input"
                                   type="checkbox"
                                   id="lembrar">
                            <label class="form-check-label"
                                   for="lembrar">
                                Lembrar-me
                            </label>
                        </div>
                        <a href="#">
                            Esqueci minha senha
                        </a>
                    </div>
                    <button type="submit"
                            class="btn btn-primary w-100 btn-login">
                        Entrar
                    </button>
                </form>
                <div class="footer-text">
                    Não possui conta?
                    <a href="#">Cadastre-se</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
